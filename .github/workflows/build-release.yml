name: 自动编译 Windows EXE 与 Android APK 安装包

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v6

      - name: 配置 Node.js 22 环境
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: 配置 Java JDK 17 环境
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android SDK 环境
        uses: android-actions/setup-android@v4

      - name: 构建相对路径 Web 资源并编译 Android APK
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm install --legacy-peer-deps @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
          cd android && chmod +x ./gradlew && ./gradlew assembleDebug

      - name: 上传 Android APK 安装包产物
        uses: actions/upload-artifact@v6
        with:
          name: zlib-downloader-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v6

      - name: 配置 Node.js 22 环境
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: 配置 Rust 编译链
        uses: dtolnay/rust-toolchain@stable

      - name: 构建 Tauri Windows EXE 便携版与 NSIS 安装包
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx --yes @tauri-apps/cli@1.5 build

      - name: 上传 Windows EXE 构建产物
        uses: actions/upload-artifact@v6
        with:
          name: zlib-downloader-windows-exe
          path: |
            src-tauri/target/release/zlib-downloader.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
