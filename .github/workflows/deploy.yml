name: 打包并推送至 gh-pages 分支自动部署 GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-push-gh-pages:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 检出仓库代码 (Checkout)
        uses: actions/checkout@v6

      - name: 2. 配置 Node.js 22 运行环境
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. 安装项目依赖
        run: npm install --legacy-peer-deps

      - name: 4. 使用相对路径 (base ./ ) 构建前端静态产物
        run: |
          npm run build
          grep -q "./assets/" dist/index.html || (echo "[警告] 未检测到相对路径 ./assets/，请检查 vite.config.ts" && exit 1)
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: 5. 推送打包产物 dist/ 至 gh-pages 分支触发部署
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: 相对路径打包 dist 并推送部署至 gh-pages 分支 [skip ci]'
